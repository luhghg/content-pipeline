services:
  web:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    volumes:
    - .:/app
    command: ["python", "main.py"]



  worker:
    build: .
    command: tail -f /dev/null
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
    - .:/app



  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"




  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
